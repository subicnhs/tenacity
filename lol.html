<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Finger Tracking</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #02070a;
    overflow: hidden;
}

#camera {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    filter: contrast(1.05) brightness(.8) saturate(.8);
}

#canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0, 255, 255, .035) 0px,
            rgba(0, 255, 255, .035) 1px,
            transparent 1px,
            transparent 5px
        );
    mix-blend-mode: screen;
}

.vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(
            circle,
            transparent 35%,
            rgba(0, 0, 0, .25) 70%,
            rgba(0, 0, 0, .8) 100%
        );
}

.hud {
    position: absolute;
    z-index: 5;
    color: #20f6ff;
    text-shadow: 0 0 8px #00eaff;
    pointer-events: none;
}

.top-left {
    top: 22px;
    left: 22px;
    width: 300px;
    padding: 15px;
    border: 1px solid rgba(32,246,255,.7);
    background: rgba(2,15,22,.75);
    clip-path: polygon(
        0 0,
        92% 0,
        100% 22%,
        100% 100%,
        0 100%
    );
}

.title {
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.status {
    font-size: 11px;
    color: #fff;
    line-height: 1.8;
    text-shadow: none;
}

.online {
    color: #35ff9c;
}

.top-right {
    top: 25px;
    right: 25px;
    text-align: right;
    font-size: 11px;
    line-height: 1.8;
}

.bottom {
    position: absolute;
    z-index: 5;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: rgba(2,12,18,.85);
    border-top: 1px solid rgba(32,246,255,.5);
    color: #20f6ff;
    font-size: 11px;
    letter-spacing: 1px;
}

.permission {
    position: absolute;
    z-index: 20;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #02070a;
    color: #20f6ff;
    text-align: center;
}

.permission-box {
    width: min(90%, 420px);
    padding: 30px;
    border: 1px solid #20f6ff;
    box-shadow: 0 0 35px rgba(0,238,255,.15);
    background: rgba(3,17,24,.95);
}

.permission-box h1 {
    font-size: 20px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.permission-box p {
    color: #a8c8cc;
    font-size: 12px;
    line-height: 1.7;
    margin-bottom: 20px;
}

button {
    padding: 12px 25px;
    background: transparent;
    border: 1px solid #20f6ff;
    color: #20f6ff;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 2px;
}

button:hover {
    background: #20f6ff;
    color: #001014;
    box-shadow: 0 0 20px #20f6ff;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div id="app">

    <video id="camera" autoplay muted playsinline></video>

    <canvas id="canvas"></canvas>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="hud top-left">
        <div class="title">
            CYBER FRAME // ACTIVE
        </div>

        <div class="status">
            CAMERA NODE / 01<br>
            SUBJECT DETECTION /
            <span id="handCount">00</span><br>
            FINGER TRACKING /
            <span class="online">ONLINE</span><br>
            SYSTEM /
            <span class="online">STABLE</span>
        </div>
    </div>

    <div class="hud top-right">
        <div>LIVE OPTICAL ANALYSIS</div>
        <div id="fps">FPS 00</div>
        <div id="coordinates">X: 0000 Y: 0000</div>
    </div>

    <div class="bottom">
        <span>CAMERA NODE / 01</span>
        <span>HAND FRAME ACTIVE</span>
        <span>ESC / STOP</span>
    </div>

    <div id="permission" class="permission">
        <div class="permission-box">
            <h1>CAMERA ACCESS</h1>
            <p>
                CYBER FRAME requires access to your camera
                to detect and track your fingers in real time.
            </p>

            <button id="start">
                INITIALIZE CAMERA
            </button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const permission = document.getElementById("permission");
const startButton = document.getElementById("start");

const handCount = document.getElementById("handCount");
const fpsElement = document.getElementById("fps");
const coordinates = document.getElementById("coordinates");

let camera = null;
let previousTime = performance.now();

const trails = new Map();

const fingerNames = {
    4: "THUMB",
    8: "INDEX",
    12: "MIDDLE",
    16: "RING",
    20: "PINKY"
};

const connections = [
    [0,1], [1,2], [2,3], [3,4],
    [0,5], [5,6], [6,7], [7,8],
    [5,9], [9,10], [10,11], [11,12],
    [9,13], [13,14], [14,15], [15,16],
    [13,17], [17,18], [18,19], [19,20],
    [0,17]
];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


function getPoint(landmark) {

    return {
        x: (1 - landmark.x) * canvas.width,
        y: landmark.y * canvas.height
    };

}


function line(x1, y1, x2, y2, color, width = 1) {

    ctx.beginPath();

    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);

    ctx.strokeStyle = color;
    ctx.lineWidth = width;

    ctx.shadowBlur = 8;
    ctx.shadowColor = color;

    ctx.stroke();

    ctx.shadowBlur = 0;
}


function neonDot(x, y, radius = 5) {

    for (let i = radius * 4; i > 0; i -= 2) {

        const alpha = (1 - i / (radius * 4)) * .2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            i,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            `rgba(0,240,255,${alpha})`;

        ctx.lineWidth = 2;

        ctx.stroke();
    }

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#00f6ff";
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00f6ff";

    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#ffffff";
    ctx.fill();
}


function cornerBox(x, y, w, h) {

    const c = "#00eaff";
    const length = 28;

    ctx.lineWidth = 2;
    ctx.strokeStyle = c;
    ctx.shadowBlur = 12;
    ctx.shadowColor = c;

    // top left
    line(x, y, x + length, y, c, 2);
    line(x, y, x, y + length, c, 2);

    // top right
    line(x + w, y, x + w - length, y, c, 2);
    line(x + w, y, x + w, y + length, c, 2);

    // bottom left
    line(x, y + h, x + length, y + h, c, 2);
    line(x, y + h, x, y + h - length, c, 2);

    // bottom right
    line(x + w, y + h, x + w - length, y + h, c, 2);
    line(x + w, y + h, x + w, y + h - length, c, 2);

    ctx.shadowBlur = 0;
}


function label(text, x, y) {

    ctx.font = "10px Courier New";

    const width =
        ctx.measureText(text).width + 14;

    ctx.fillStyle =
        "rgba(0,15,22,.85)";

    ctx.fillRect(
        x,
        y - 15,
        width,
        21
    );

    ctx.strokeStyle =
        "rgba(0,234,255,.7)";

    ctx.lineWidth = 1;

    ctx.strokeRect(
        x,
        y - 15,
        width,
        21
    );

    ctx.fillStyle = "#00eaff";

    ctx.fillText(
        text,
        x + 7,
        y
    );
}


function scanArea(x, y, w, h) {

    ctx.save();

    ctx.beginPath();

    ctx.rect(x, y, w, h);

    ctx.clip();

    for (
        let scanY = y;
        scanY < y + h;
        scanY += 7
    ) {

        ctx.strokeStyle =
            "rgba(0,240,255,.035)";

        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.moveTo(x, scanY);
        ctx.lineTo(x + w, scanY);

        ctx.stroke();
    }

    ctx.restore();
}


function drawTrail(id, point) {

    if (!trails.has(id)) {
        trails.set(id, []);
    }

    const trail = trails.get(id);

    trail.push({
        x: point.x,
        y: point.y,
        time: performance.now()
    });

    if (trail.length > 30) {
        trail.shift();
    }

    for (let i = 1; i < trail.length; i++) {

        const previous = trail[i - 1];
        const current = trail[i];

        const alpha = i / trail.length;

        ctx.strokeStyle =
            `rgba(0,234,255,${alpha * .75})`;

        ctx.lineWidth =
            Math.max(1, alpha * 4);

        ctx.beginPath();

        ctx.moveTo(
            previous.x,
            previous.y
        );

        ctx.lineTo(
            current.x,
            current.y
        );

        ctx.stroke();
    }
}


function processHands(results) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const handsDetected =
        results.multiHandLandmarks
        ? results.multiHandLandmarks.length
        : 0;

    handCount.textContent =
        String(handsDetected).padStart(2, "0");

    if (!results.multiHandLandmarks) {
        return;
    }

    results.multiHandLandmarks.forEach(
        (landmarks, handIndex) => {

            const points =
                landmarks.map(getPoint);

            // ------------------------------------------
            // Bounding box
            // ------------------------------------------

            let minX = canvas.width;
            let minY = canvas.height;
            let maxX = 0;
            let maxY = 0;

            points.forEach(point => {

                minX = Math.min(minX, point.x);
                minY = Math.min(minY, point.y);

                maxX = Math.max(maxX, point.x);
                maxY = Math.max(maxY, point.y);
            });

            const padding = 35;

            minX = Math.max(
                0,
                minX - padding
            );

            minY = Math.max(
                0,
                minY - padding
            );

            maxX = Math.min(
                canvas.width,
                maxX + padding
            );

            maxY = Math.min(
                canvas.height,
                maxY + padding
            );

            const boxWidth =
                maxX - minX;

            const boxHeight =
                maxY - minY;

            scanArea(
                minX,
                minY,
                boxWidth,
                boxHeight
            );

            cornerBox(
                minX,
                minY,
                boxWidth,
                boxHeight
            );

            label(
                `SUBJECT DETECTION / ${String(handIndex + 1).padStart(2,"0")}`,
                minX,
                Math.max(25, minY - 5)
            );

            label(
                "HAND FRAME ACTIVE",
                minX,
                maxY + 30
            );

            // ------------------------------------------
            // Skeleton
            // ------------------------------------------

            connections.forEach(connection => {

                const a =
                    points[connection[0]];

                const b =
                    points[connection[1]];

                line(
                    a.x,
                    a.y,
                    b.x,
                    b.y,
                    "rgba(0,220,255,.65)",
                    2
                );
            });

            // ------------------------------------------
            // All landmarks
            // ------------------------------------------

            points.forEach((point, index) => {

                ctx.beginPath();

                ctx.arc(
                    point.x,
                    point.y,
                    index === 0 ? 5 : 3,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    index === 0
                        ? "#ffffff"
                        : "#00dfff";

                ctx.shadowBlur = 10;
                ctx.shadowColor = "#00eaff";

                ctx.fill();

                ctx.shadowBlur = 0;
            });

            // ------------------------------------------
            // Finger tracking
            // ------------------------------------------

            Object.entries(fingerNames)
                .forEach(([id, name]) => {

                    const landmarkId =
                        Number(id);

                    const point =
                        points[landmarkId];

                    drawTrail(
                        `${handIndex}-${landmarkId}`,
                        point
                    );

                    neonDot(
                        point.x,
                        point.y,
                        7
                    );

                    let labelX =
                        point.x + 12;

                    let labelY =
                        point.y - 12;

                    if (labelX > canvas.width - 120) {
                        labelX =
                            point.x - 110;
                    }

                    if (labelY < 25) {
                        labelY =
                            point.y + 30;
                    }

                    label(
                        name,
                        labelX,
                        labelY
                    );

                    // Coordinate readout
                    ctx.font =
                        "9px Courier New";

                    ctx.fillStyle =
                        "#d8ffff";

                    ctx.fillText(
                        `X:${Math.round(point.x)} Y:${Math.round(point.y)}`,
                        labelX,
                        labelY + 30
                    );

                    // Update main coordinate HUD
                    if (landmarkId === 8) {

                        coordinates.textContent =
                            `X: ${String(Math.round(point.x)).padStart(4,"0")} ` +
                            `Y: ${String(Math.round(point.y)).padStart(4,"0")}`;
                    }
                });

            // ------------------------------------------
            // Futuristic fingertip connections
            // ------------------------------------------

            const fingertips = [
                points[4],
                points[8],
                points[12],
                points[16],
                points[20]
            ];

            for (
                let i = 0;
                i < fingertips.length - 1;
                i++
            ) {

                line(
                    fingertips[i].x,
                    fingertips[i].y,
                    fingertips[i + 1].x,
                    fingertips[i + 1].y,
                    "rgba(0,240,255,.25)",
                    1
                );
            }

            // ------------------------------------------
            // Palm targeting system
            // ------------------------------------------

            const palmIndexes = [
                0,
                5,
                9,
                13,
                17
            ];

            let palmX = 0;
            let palmY = 0;

            palmIndexes.forEach(index => {

                palmX += points[index].x;
                palmY += points[index].y;
            });

            palmX /= palmIndexes.length;
            palmY /= palmIndexes.length;

            ctx.beginPath();

            ctx.arc(
                palmX,
                palmY,
                18,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle =
                "#00eaff";

            ctx.lineWidth = 1;
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#00eaff";

            ctx.stroke();

            ctx.shadowBlur = 0;

            line(
                palmX - 25,
                palmY,
                palmX + 25,
                palmY,
                "#00eaff",
                1
            );

            line(
                palmX,
                palmY - 25,
                palmX,
                palmY + 25,
                "#00eaff",
                1
            );

            label(
                "PALM TRACK",
                palmX + 25,
                palmY
            );
        }
    );
}


const hands = new Hands({
    locateFile: file => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
});

hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
});

hands.onResults(processHands);


async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    width: {
                        ideal: 1280
                    },
                    height: {
                        ideal: 720
                    },
                    facingMode: "user"
                },
                audio: false
            });

        video.srcObject = stream;

        await video.play();

        permission.classList.add("hidden");

        camera = new Camera(video, {
            onFrame: async () => {

                await hands.send({
                    image: video
                });
            },

            width: 1280,
            height: 720
        });

        camera.start();

    } catch (error) {

        alert(
            "Camera access was denied or unavailable."
        );

        console.error(error);
    }
}


startButton.addEventListener(
    "click",
    startCamera
);


let lastFPSUpdate = performance.now();
let frameCounter = 0;

function updateFPS() {

    frameCounter++;

    const now =
        performance.now();

    if (now - lastFPSUpdate >= 1000) {

        fpsElement.textContent =
            `FPS ${String(frameCounter).padStart(2,"0")}`;

        frameCounter = 0;
        lastFPSUpdate = now;
    }

    requestAnimationFrame(updateFPS);
}

updateFPS();


document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            if (video.srcObject) {

                video.srcObject
                    .getTracks()
                    .forEach(track => track.stop());
            }

            location.reload();
        }
    }
);
</script>

</body>
</html>

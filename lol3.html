<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Hand Gesture Effect</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    filter: brightness(.82) contrast(1.08) saturate(.85);
}

#canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(0,255,255,.035) 0px,
            rgba(0,255,255,.035) 1px,
            transparent 1px,
            transparent 5px
        );
}

.vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.3) 75%,
            rgba(0,0,0,.85) 100%
        );
}

.hud {
    position: absolute;
    z-index: 5;
    color: #b9ffff;
    pointer-events: none;
    text-shadow: 0 0 8px #00eaff;
}

.top-left {
    top: 8%;
    left: 8%;
    font-size: 10px;
    letter-spacing: 1px;
}

.top-right {
    top: 14%;
    right: 8%;
    width: 155px;
    padding: 16px;
    background: rgba(4,18,27,.8);
    border-left: 2px solid #00eaff;

    clip-path: polygon(
        10% 0,
        100% 0,
        100% 100%,
        0 100%,
        0 12%
    );
}

.top-right .small {
    font-size: 7px;
    color: #67aab1;
    margin-bottom: 10px;
}

.top-right .big {
    color: white;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

#gestureStatus {
    margin-top: 10px;
    color: #67aab1;
    font-size: 8px;
}

.bottom-left {
    position: absolute;
    z-index: 5;
    left: 5%;
    bottom: 8%;
    color: #00eaff;
    font-size: 8px;
    letter-spacing: 1px;
}

#gestureFlash {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(0,255,255,.25),
            transparent 45%
        );
}

#gestureFlash.active {
    animation: flash .45s ease-out;
}

@keyframes flash {

    0% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

#startScreen {
    position: absolute;
    z-index: 100;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #020607;
}

.startBox {
    width: min(90%, 400px);
    padding: 35px;
    text-align: center;

    color: #00eaff;

    border: 1px solid #00eaff;

    box-shadow:
        0 0 30px rgba(0,234,255,.15),
        inset 0 0 30px rgba(0,234,255,.03);
}

.startBox h1 {
    font-size: 20px;
    letter-spacing: 4px;
    margin: 0 0 15px;
}

.startBox p {
    color: #8aa8ad;
    font-size: 11px;
    line-height: 1.7;
}

button {
    margin-top: 15px;
    padding: 12px 25px;

    color: #00eaff;
    background: transparent;

    border: 1px solid #00eaff;

    font-family: inherit;
    cursor: pointer;
}

button:hover {
    color: #001014;
    background: #00eaff;
    box-shadow: 0 0 25px #00eaff;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="app">

    <video id="video" autoplay muted playsinline></video>

    <canvas id="canvas"></canvas>

    <div id="gestureFlash"></div>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="hud top-left">
        CYBER FRAME // ACTIVE
    </div>

    <div class="hud top-right">

        <div class="small">
            CAMERA NODE / 02
        </div>

        <div class="big">
            SUBJECT<br>
            DETECTION
        </div>

        <div id="gestureStatus">
            GESTURE: WAITING
        </div>

    </div>

    <div class="bottom-left">
        ● FINGER TRACKING ACTIVE
    </div>

    <div id="startScreen">

        <div class="startBox">

            <h1>CYBER FRAME</h1>

            <p>
                Move your pinky finger toward your thumb.
                When the pinky and thumb touch, a cyber
                energy effect will activate.
            </p>

            <button id="start">
                INITIALIZE CAMERA
            </button>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("start");

const gestureStatus =
    document.getElementById("gestureStatus");

const gestureFlash =
    document.getElementById("gestureFlash");

let stream = null;

let handsDetected = [];

let particles = [];

let touching = false;

let lastTrigger = 0;


/* =========================================================
   CANVAS
========================================================= */

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   MEDIAPIPE HAND TRACKING
========================================================= */

const hands = new Hands({

    locateFile: file => {

        return (
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
            file
        );

    }

});


hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: .65,

    minTrackingConfidence: .65

});


hands.onResults(results => {

    handsDetected =
        results.multiHandLandmarks || [];

});


/* =========================================================
   COORDINATE CONVERSION
========================================================= */

function point(landmark) {

    return {

        x:
            (1 - landmark.x) *
            canvas.width,

        y:
            landmark.y *
            canvas.height

    };

}


/* =========================================================
   DISTANCE BETWEEN TWO FINGERS
========================================================= */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   LINE
========================================================= */

function line(
    a,
    b,
    color = "#00eaff",
    width = 1
) {

    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        width;

    ctx.shadowBlur = 10;

    ctx.shadowColor =
        color;

    ctx.stroke();

    ctx.shadowBlur = 0;

}


/* =========================================================
   FINGER DOT
========================================================= */

function fingerDot(
    p,
    active = false
) {

    const color =
        active
            ? "#ffffff"
            : "#00eaff";

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        active ? 9 : 5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        color;

    ctx.shadowBlur =
        active ? 30 : 15;

    ctx.shadowColor =
        "#00eaff";

    ctx.fill();

    ctx.shadowBlur = 0;

}


/* =========================================================
   CREATE PARTICLES
========================================================= */

function createBurst(x, y) {

    const count = 90;

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            2 +
            Math.random() * 8;

        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                1 +
                Math.random() * 4,

            life: 1,

            decay:
                .012 +
                Math.random() * .025,

            hue:
                Math.random() > .25
                    ? 185
                    : 200

        });

    }

}


/* =========================================================
   CREATE ENERGY RING
========================================================= */

function createEnergyRing(x, y) {

    particles.push({

        type: "ring",

        x: x,

        y: y,

        radius: 8,

        maxRadius: 120,

        life: 1

    });

}


/* =========================================================
   CREATE CROSSHAIR
========================================================= */

function createCrosshair(x, y) {

    particles.push({

        type: "crosshair",

        x: x,

        y: y,

        radius: 10,

        life: 1

    });

}


/* =========================================================
   GESTURE TRIGGER
========================================================= */

function triggerGesture(
    pinky,
    thumb
) {

    const now =
        performance.now();

    /*
       Prevent the effect from firing
       every single video frame.
    */

    if (
        now - lastTrigger <
        500
    ) {

        return;

    }

    lastTrigger =
        now;

    const x =
        (pinky.x + thumb.x) / 2;

    const y =
        (pinky.y + thumb.y) / 2;


    /* Particle explosion */

    createBurst(
        x,
        y
    );


    /* Expanding energy ring */

    createEnergyRing(
        x,
        y
    );


    /* Target crosshair */

    createCrosshair(
        x,
        y
    );


    /* Screen flash */

    gestureFlash.classList.remove(
        "active"
    );

    void gestureFlash.offsetWidth;

    gestureFlash.classList.add(
        "active"
    );


    /* HUD */

    gestureStatus.textContent =
        "GESTURE: PINKY + THUMB LOCK";

    gestureStatus.style.color =
        "#ffffff";

}


/* =========================================================
   DETECT PINKY + THUMB TOUCH
========================================================= */

function detectGesture() {

    let detected =
        false;


    for (
        const landmarks of handsDetected
    ) {

        /*
           MediaPipe:

           4  = thumb tip
           20 = pinky tip
        */

        const thumb =
            point(
                landmarks[4]
            );

        const pinky =
            point(
                landmarks[20]
            );


        const d =
            distance(
                thumb,
                pinky
            );


        /*
           Threshold depends on camera
           resolution.

           55px is a practical starting
           point for a full-screen camera.
        */

        const threshold =
            Math.min(
                canvas.width,
                canvas.height
            ) * .075;


        const isTouching =
            d < threshold;


        /* Draw finger connection */

        line(
            thumb,
            pinky,
            isTouching
                ? "#ffffff"
                : "rgba(0,234,255,.35)",
            isTouching ? 3 : 1
        );


        fingerDot(
            thumb,
            isTouching
        );

        fingerDot(
            pinky,
            isTouching
        );


        /*
           Distance indicator
        */

        ctx.font =
            "9px Courier New";

        ctx.fillStyle =
            isTouching
                ? "#ffffff"
                : "#00eaff";

        ctx.shadowBlur = 8;

        ctx.shadowColor =
            "#00eaff";

        ctx.fillText(
            isTouching
                ? "CONTACT"
                : `DIST ${Math.round(d)}`,
            pinky.x + 12,
            pinky.y
        );

        ctx.shadowBlur = 0;


        if (isTouching) {

            detected =
                true;


            /*
               Trigger only when the
               fingers transition from
               separated -> touching.
            */

            if (!touching) {

                triggerGesture(
                    pinky,
                    thumb
                );

            }

        }

    }


    touching =
        detected;


    if (!detected) {

        gestureStatus.textContent =
            "GESTURE: WAITING";

        gestureStatus.style.color =
            "#67aab1";

    }

}


/* =========================================================
   PARTICLE RENDERING
========================================================= */

function renderParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        /* ---------------------------------------------
           PARTICLE
        --------------------------------------------- */

        if (!p.type) {

            p.x += p.vx;

            p.y += p.vy;

            p.vx *= .97;

            p.vy *= .97;

            p.life -=
                p.decay;


            if (p.life <= 0) {

                particles.splice(
                    i,
                    1
                );

                continue;

            }


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                `hsla(
                    ${p.hue},
                    100%,
                    70%,
                    ${p.life}
                )`;

            ctx.shadowBlur = 15;

            ctx.shadowColor =
                "#00eaff";

            ctx.fill();

            ctx.shadowBlur = 0;

        }


        /* ---------------------------------------------
           ENERGY RING
        --------------------------------------------- */

        else if (
            p.type === "ring"
        ) {

            p.radius += 5;

            p.life -= .025;


            if (p.life <= 0) {

                particles.splice(
                    i,
                    1
                );

                continue;

            }


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.radius,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle =
                `rgba(
                    0,
                    234,
                    255,
                    ${p.life}
                )`;

            ctx.lineWidth =
                3 * p.life;

            ctx.shadowBlur = 25;

            ctx.shadowColor =
                "#00eaff";

            ctx.stroke();

            ctx.shadowBlur = 0;

        }


        /* ---------------------------------------------
           CROSSHAIR
        --------------------------------------------- */

        else if (
            p.type === "crosshair"
        ) {

            p.radius += 2;

            p.life -= .035;


            if (p.life <= 0) {

                particles.splice(
                    i,
                    1
                );

                continue;

            }


            const r =
                p.radius;


            ctx.strokeStyle =
                `rgba(
                    255,
                    255,
                    255,
                    ${p.life}
                )`;

            ctx.lineWidth = 1;


            /* Circle */

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                r,
                0,
                Math.PI * 2
            );

            ctx.stroke();


            /* Horizontal */

            ctx.beginPath();

            ctx.moveTo(
                p.x - r - 12,
                p.y
            );

            ctx.lineTo(
                p.x - r,
                p.y
            );

            ctx.moveTo(
                p.x + r,
                p.y
            );

            ctx.lineTo(
                p.x + r + 12,
                p.y
            );

            ctx.stroke();


            /* Vertical */

            ctx.beginPath();

            ctx.moveTo(
                p.x,
                p.y - r - 12
            );

            ctx.lineTo(
                p.x,
                p.y - r
            );

            ctx.moveTo(
                p.x,
                p.y + r
            );

            ctx.lineTo(
                p.x,
                p.y + r + 12
            );

            ctx.stroke();

        }

    }

}


/* =========================================================
   DRAW BASIC HAND SKELETON
========================================================= */

const connections = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [5,9],
    [9,10],
    [10,11],
    [11,12],

    [9,13],
    [13,14],
    [14,15],
    [15,16],

    [13,17],
    [17,18],
    [18,19],
    [19,20],

    [0,17]

];


function drawHands() {

    for (
        const landmarks of handsDetected
    ) {

        const points =
            landmarks.map(
                point
            );


        /* Skeleton */

        for (
            const [a, b]
            of connections
        ) {

            line(
                points[a],
                points[b],
                "rgba(0,210,255,.45)",
                1
            );

        }


        /*
           Highlight pinky and thumb
        */

        fingerDot(
            points[4]
        );

        fingerDot(
            points[20]
        );


        /*
           Label them
        */

        ctx.font =
            "9px Courier New";

        ctx.fillStyle =
            "#00eaff";

        ctx.fillText(
            "THUMB",
            points[4].x + 10,
            points[4].y - 10
        );

        ctx.fillText(
            "PINKY",
            points[20].x + 10,
            points[20].y - 10
        );

    }

}


/* =========================================================
   MAIN RENDER LOOP
========================================================= */

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawHands();


    detectGesture();


    renderParticles();


    requestAnimationFrame(
        render
    );

}


/* =========================================================
   CAMERA START
========================================================= */

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    facingMode: "user"

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.classList.add(
            "hidden"
        );


        async function processCamera() {

            if (
                video.readyState >=
                HTMLMediaElement.HAVE_CURRENT_DATA
            ) {

                await hands.send({

                    image: video

                });

            }

            requestAnimationFrame(
                processCamera
            );

        }


        processCamera();


        render();


    }

    catch (error) {

        console.error(error);

        alert(
            "Camera access was denied or unavailable."
        );

    }

}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   ESC TO STOP
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

            }

            location.reload();

        }

    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Finger Frame</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    filter: brightness(.82) contrast(1.08) saturate(.85);
}

#canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(0,255,255,.035) 0px,
            rgba(0,255,255,.035) 1px,
            transparent 1px,
            transparent 5px
        );
}

.vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.3) 75%,
            rgba(0,0,0,.85) 100%
        );
}

.hud {
    position: absolute;
    z-index: 5;
    color: #b9ffff;
    pointer-events: none;
    text-shadow: 0 0 8px #00eaff;
}

.top-left {
    top: 8%;
    left: 8%;
    font-size: 10px;
    letter-spacing: 1px;
}

.top-right {
    top: 14%;
    right: 8%;
    width: 145px;
    padding: 16px;
    background: rgba(4,18,27,.8);
    border-left: 2px solid #00eaff;
    clip-path: polygon(
        10% 0,
        100% 0,
        100% 100%,
        0 100%,
        0 12%
    );
}

.top-right .small {
    font-size: 7px;
    color: #67aab1;
    margin-bottom: 12px;
}

.top-right .big {
    color: white;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

.bottom-left {
    position: absolute;
    z-index: 5;
    left: 5%;
    bottom: 8%;
    color: #00eaff;
    font-size: 8px;
    letter-spacing: 1px;
}

#startScreen {
    position: absolute;
    z-index: 100;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #020607;
}

.startBox {
    width: min(90%, 400px);
    padding: 35px;
    text-align: center;
    color: #00eaff;
    border: 1px solid #00eaff;
    box-shadow:
        0 0 30px rgba(0,234,255,.15),
        inset 0 0 30px rgba(0,234,255,.03);
}

.startBox h1 {
    font-size: 20px;
    letter-spacing: 4px;
    margin: 0 0 15px;
}

.startBox p {
    color: #8aa8ad;
    font-size: 11px;
    line-height: 1.7;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    color: #00eaff;
    background: transparent;
    border: 1px solid #00eaff;
    font-family: inherit;
    cursor: pointer;
}

button:hover {
    color: #001014;
    background: #00eaff;
    box-shadow: 0 0 25px #00eaff;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="app">

    <video id="video" autoplay muted playsinline></video>

    <canvas id="canvas"></canvas>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="hud top-left">
        CYBER FRAME // ACTIVE
    </div>

    <div class="hud top-right">
        <div class="small">CAMERA NODE / 02</div>

        <div class="big">
            SUBJECT<br>
            DETECTION
        </div>

        <br>

        <div class="small">
            HAND FRAME ACTIVE
        </div>
    </div>

    <div class="bottom-left">
        ● CYBER FRAME ACTIVE
    </div>

    <div id="startScreen">
        <div class="startBox">
            <h1>CYBER FRAME</h1>

            <p>
                Place both hands in front of the camera.
                Touch your thumbs and index fingers to
                create a tracked digital frame.
            </p>

            <button id="start">
                INITIALIZE CAMERA
            </button>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("start");

let stream = null;
let animationFrame = null;

let handsDetected = [];
let lastFrameTime = performance.now();

const cyan = "#00eaff";
const cyanBright = "#7fffff";


/* =========================================================
   CANVAS
========================================================= */

function resize() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   MEDIA PIPE
========================================================= */

const hands = new Hands({
    locateFile: file => {
        return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file;
    }
});

hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: 0.65,

    minTrackingConfidence: 0.65

});


hands.onResults(results => {

    handsDetected =
        results.multiHandLandmarks || [];

});


/* =========================================================
   CONVERT MEDIAPIPE COORDINATES
========================================================= */

function point(landmark) {

    return {

        x: (1 - landmark.x) * canvas.width,

        y: landmark.y * canvas.height

    };

}


/* =========================================================
   DRAW LINE
========================================================= */

function drawLine(a, b, color = cyan, width = 1) {

    ctx.beginPath();

    ctx.moveTo(a.x, a.y);

    ctx.lineTo(b.x, b.y);

    ctx.strokeStyle = color;

    ctx.lineWidth = width;

    ctx.shadowBlur = 10;

    ctx.shadowColor = color;

    ctx.stroke();

    ctx.shadowBlur = 0;

}


/* =========================================================
   DRAW POINT
========================================================= */

function drawPoint(p, size = 5) {

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        size,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = cyanBright;

    ctx.shadowBlur = 20;

    ctx.shadowColor = cyan;

    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#ffffff";

    ctx.fill();

}


/* =========================================================
   CYBER CORNER
========================================================= */

function corner(p, directionX, directionY) {

    const size = 16;

    drawLine(
        p,
        {
            x: p.x + size * directionX,
            y: p.y
        },
        cyan,
        2
    );

    drawLine(
        p,
        {
            x: p.x,
            y: p.y + size * directionY
        },
        cyan,
        2
    );

}


/* =========================================================
   QUADRILATERAL FRAME
========================================================= */

function drawFrame(points) {

    if (points.length !== 4) {
        return;
    }

    const [a, b, c, d] = points;

    /*
       The actual effect seen in the video:

       A ---- B
       |      |
       D ---- C

       The four points are controlled by
       the user's fingers.
    */

    const minX = Math.min(
        a.x,
        b.x,
        c.x,
        d.x
    );

    const maxX = Math.max(
        a.x,
        b.x,
        c.x,
        d.x
    );

    const minY = Math.min(
        a.y,
        b.y,
        c.y,
        d.y
    );

    const maxY = Math.max(
        a.y,
        b.y,
        c.y,
        d.y
    );


    /* -----------------------------------------------------
       BLUE TRANSPARENT FILTER
    ----------------------------------------------------- */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(c.x, c.y);
    ctx.lineTo(d.x, d.y);

    ctx.closePath();

    ctx.clip();

    const gradient =
        ctx.createLinearGradient(
            minX,
            minY,
            maxX,
            maxY
        );

    gradient.addColorStop(
        0,
        "rgba(0,180,255,.22)"
    );

    gradient.addColorStop(
        .5,
        "rgba(20,80,255,.18)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,255,255,.10)"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        minX,
        minY,
        maxX - minX,
        maxY - minY
    );


    /* -----------------------------------------------------
       SCANLINES INSIDE FRAME
    ----------------------------------------------------- */

    const time =
        performance.now() * .08;

    for (
        let y = minY;
        y < maxY;
        y += 5
    ) {

        ctx.strokeStyle =
            "rgba(100,240,255,.11)";

        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.moveTo(minX, y);
        ctx.lineTo(maxX, y);

        ctx.stroke();

    }


    /* -----------------------------------------------------
       MOVING SCANNER
    ----------------------------------------------------- */

    const scannerY =
        minY +
        ((time % 1000) / 1000) *
        (maxY - minY);

    ctx.strokeStyle =
        "rgba(100,255,255,.55)";

    ctx.shadowBlur = 15;

    ctx.shadowColor = cyan;

    ctx.beginPath();

    ctx.moveTo(
        minX,
        scannerY
    );

    ctx.lineTo(
        maxX,
        scannerY
    );

    ctx.stroke();

    ctx.shadowBlur = 0;

    ctx.restore();


    /* -----------------------------------------------------
       FRAME BORDER
    ----------------------------------------------------- */

    drawLine(a, b, cyan, 1.5);
    drawLine(b, c, cyan, 1.5);
    drawLine(c, d, cyan, 1.5);
    drawLine(d, a, cyan, 1.5);


    /* -----------------------------------------------------
       CORNERS
    ----------------------------------------------------- */

    corner(a, 1, 1);
    corner(b, -1, 1);
    corner(c, -1, -1);
    corner(d, 1, -1);


    /* -----------------------------------------------------
       FINGER TARGETS
    ----------------------------------------------------- */

    points.forEach(p => {

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            7,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            cyanBright;

        ctx.lineWidth = 1;

        ctx.shadowBlur = 12;

        ctx.shadowColor = cyan;

        ctx.stroke();

        ctx.shadowBlur = 0;

        drawPoint(p, 3);

    });


    /* -----------------------------------------------------
       FRAME INFORMATION
    ----------------------------------------------------- */

    ctx.font =
        "9px Courier New";

    ctx.fillStyle =
        cyanBright;

    ctx.shadowBlur = 8;
    ctx.shadowColor = cyan;

    ctx.fillText(
        "HAND FRAME ACTIVE",
        minX,
        maxY + 18
    );

    ctx.shadowBlur = 0;

}


/* =========================================================
   FIND THE FOUR FINGERS
========================================================= */

function getFramePoints() {

    if (handsDetected.length < 1) {

        return null;

    }


    /*
       We use:

       Hand 1:
       INDEX FINGER
       THUMB

       Hand 2:
       INDEX FINGER
       THUMB

       This reproduces the physical
       "finger frame" shown in the video.
    */


    if (handsDetected.length >= 2) {

        const handA =
            handsDetected[0];

        const handB =
            handsDetected[1];


        const a =
            point(handA[8]);

        const d =
            point(handA[4]);

        const b =
            point(handB[8]);

        const c =
            point(handB[4]);


        /*
           Sort left/right so the
           quadrilateral doesn't cross.
        */

        const left =
            a.x < b.x
                ? { index: a, thumb: d }
                : { index: b, thumb: c };

        const right =
            a.x < b.x
                ? { index: b, thumb: c }
                : { index: a, thumb: d };


        return [

            left.index,

            right.index,

            right.thumb,

            left.thumb

        ];

    }


    /*
       If only one hand is visible,
       create a smaller frame around
       its thumb/index area.
    */

    const hand =
        handsDetected[0];

    const index =
        point(hand[8]);

    const thumb =
        point(hand[4]);


    const center = {

        x: (index.x + thumb.x) / 2,

        y: (index.y + thumb.y) / 2

    };


    const dx =
        Math.abs(index.x - thumb.x);

    const dy =
        Math.abs(index.y - thumb.y);


    const width =
        Math.max(100, dx * 2.5);

    const height =
        Math.max(80, dy * 2.5);


    return [

        {
            x: center.x - width / 2,
            y: center.y - height / 2
        },

        {
            x: center.x + width / 2,
            y: center.y - height / 2
        },

        {
            x: center.x + width / 2,
            y: center.y + height / 2
        },

        {
            x: center.x - width / 2,
            y: center.y + height / 2
        }

    ];

}


/* =========================================================
   MAIN RENDER LOOP
========================================================= */

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const frame =
        getFramePoints();


    if (frame) {

        drawFrame(frame);

    }


    /*
       FPS calculation
    */

    const now =
        performance.now();

    const fps =
        1000 /
        Math.max(
            1,
            now - lastFrameTime
        );

    lastFrameTime = now;


    animationFrame =
        requestAnimationFrame(render);

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    facingMode: "user"

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.classList.add(
            "hidden"
        );


        /*
           Continuously send camera frames
           into MediaPipe.
        */

        async function process() {

            if (
                video.readyState >=
                HTMLMediaElement.HAVE_CURRENT_DATA
            ) {

                await hands.send({
                    image: video
                });

            }

            requestAnimationFrame(process);

        }


        process();


        render();


    } catch (error) {

        console.error(error);

        alert(
            "Camera access is required."
        );

    }

}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   ESC = STOP
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        track => track.stop()
                    );

            }

            cancelAnimationFrame(
                animationFrame
            );

            location.reload();

        }

    }
);

</script>

</body>
</html>

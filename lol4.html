<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Finger Frame</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    filter: brightness(.82) contrast(1.08) saturate(.85);
}

#canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(0,255,255,.035) 0px,
            rgba(0,255,255,.035) 1px,
            transparent 1px,
            transparent 5px
        );
}

.vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.3) 75%,
            rgba(0,0,0,.85) 100%
        );
}

#effectFlash {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    background:
        radial-gradient(
            circle at center,
            rgba(0,240,255,.22),
            rgba(0,100,255,.08) 30%,
            transparent 65%
        );
}

#effectFlash.active {
    animation: cyberFlash .45s ease-out;
}

@keyframes cyberFlash {

    0% {
        opacity: 1;
    }

    20% {
        opacity: .8;
    }

    100% {
        opacity: 0;
    }

}

#glitch {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
}

#glitch.active {
    animation: glitchEffect .32s steps(5);
}

@keyframes glitchEffect {

    0% {
        opacity: 0;
        transform: translate(0);
    }

    15% {
        opacity: .45;
        transform: translate(4px, -2px);
        background:
            linear-gradient(
                transparent 20%,
                rgba(0,255,255,.08) 20%,
                transparent 22%,
                transparent 65%,
                rgba(0,120,255,.1) 65%,
                transparent 67%
            );
    }

    35% {
        opacity: .2;
        transform: translate(-5px, 2px);
    }

    60% {
        opacity: .4;
        transform: translate(2px, 0);
    }

    100% {
        opacity: 0;
        transform: translate(0);
    }

}

.hud {
    position: absolute;
    z-index: 6;
    color: #b9ffff;
    pointer-events: none;
    text-shadow: 0 0 8px #00eaff;
}

.top-left {
    top: 8%;
    left: 8%;
    font-size: 10px;
    letter-spacing: 1px;
}

.top-right {
    top: 14%;
    right: 8%;
    width: 155px;
    padding: 16px;
    background: rgba(4,18,27,.8);
    border-left: 2px solid #00eaff;

    clip-path: polygon(
        10% 0,
        100% 0,
        100% 100%,
        0 100%,
        0 12%
    );
}

.top-right .small {
    font-size: 7px;
    color: #67aab1;
    margin-bottom: 12px;
}

.top-right .big {
    color: white;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

#gestureStatus {
    margin-top: 12px;
    font-size: 7px;
    color: #67aab1;
    letter-spacing: .5px;
}

.bottom-left {
    position: absolute;
    z-index: 6;
    left: 5%;
    bottom: 8%;
    color: #00eaff;
    font-size: 8px;
    letter-spacing: 1px;
}

#startScreen {
    position: absolute;
    z-index: 100;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #020607;
}

.startBox {
    width: min(90%, 400px);
    padding: 35px;
    text-align: center;
    color: #00eaff;
    border: 1px solid #00eaff;

    box-shadow:
        0 0 30px rgba(0,234,255,.15),
        inset 0 0 30px rgba(0,234,255,.03);
}

.startBox h1 {
    font-size: 20px;
    letter-spacing: 4px;
    margin: 0 0 15px;
}

.startBox p {
    color: #8aa8ad;
    font-size: 11px;
    line-height: 1.7;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    color: #00eaff;
    background: transparent;
    border: 1px solid #00eaff;
    font-family: inherit;
    cursor: pointer;
}

button:hover {
    color: #001014;
    background: #00eaff;
    box-shadow: 0 0 25px #00eaff;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="app">

    <video id="video" autoplay muted playsinline></video>

    <canvas id="canvas"></canvas>

    <div id="effectFlash"></div>
    <div id="glitch"></div>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="hud top-left">
        CYBER FRAME // ACTIVE
    </div>

    <div class="hud top-right">

        <div class="small">
            CAMERA NODE / 02
        </div>

        <div class="big">
            SUBJECT<br>
            DETECTION
        </div>

        <div id="gestureStatus">
            GESTURE / WAITING
        </div>

    </div>

    <div class="bottom-left">
        ● CYBER FRAME ACTIVE
    </div>

    <div id="startScreen">

        <div class="startBox">

            <h1>CYBER FRAME</h1>

            <p>
                Place your hand in front of the camera.
                Move your pinky toward your thumb.
                When they touch, the cyber contact
                effect will activate.
            </p>

            <button id="start">
                INITIALIZE CAMERA
            </button>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("start");

const gestureStatus =
    document.getElementById("gestureStatus");

const effectFlash =
    document.getElementById("effectFlash");

const glitch =
    document.getElementById("glitch");

let stream = null;

let animationFrame = null;

let handsDetected = [];

let particles = [];

let energyRings = [];

let contactEffects = [];

let wasTouching = false;

let lastTrigger = 0;

let lastHandTime = 0;

const cyan = "#00eaff";

const cyanBright = "#8fffff";


/* =========================================================
   CANVAS
========================================================= */

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   MEDIAPIPE HAND TRACKING
========================================================= */

const hands = new Hands({

    locateFile: file => {

        return (
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
            file
        );

    }

});


hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: 0.65,

    minTrackingConfidence: 0.65

});


hands.onResults(results => {

    handsDetected =
        results.multiHandLandmarks || [];

    lastHandTime =
        performance.now();

});


/* =========================================================
   COORDINATE CONVERSION
========================================================= */

function point(landmark) {

    return {

        x:
            (1 - landmark.x) *
            canvas.width,

        y:
            landmark.y *
            canvas.height

    };

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   LINE
========================================================= */

function drawLine(
    a,
    b,
    color = cyan,
    width = 1
) {

    ctx.beginPath();

    ctx.moveTo(
        a.x,
        a.y
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        width;

    ctx.shadowBlur =
        width > 1 ? 15 : 7;

    ctx.shadowColor =
        color;

    ctx.stroke();

    ctx.shadowBlur = 0;

}


/* =========================================================
   POINT
========================================================= */

function drawPoint(
    p,
    active = false
) {

    const radius =
        active ? 8 : 4;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        active
            ? "#ffffff"
            : cyanBright;

    ctx.shadowBlur =
        active ? 30 : 15;

    ctx.shadowColor =
        cyan;

    ctx.fill();

    ctx.shadowBlur = 0;

}


/* =========================================================
   CYBER CORNER
========================================================= */

function corner(
    p,
    directionX,
    directionY
) {

    const size = 16;

    drawLine(
        p,
        {
            x:
                p.x +
                size *
                directionX,

            y:
                p.y
        },
        cyan,
        2
    );

    drawLine(
        p,
        {
            x:
                p.x,

            y:
                p.y +
                size *
                directionY
        },
        cyan,
        2
    );

}


/* =========================================================
   FRAME
========================================================= */

function drawFrame(points) {

    if (
        !points ||
        points.length !== 4
    ) {
        return;
    }

    const [
        a,
        b,
        c,
        d
    ] = points;


    const minX =
        Math.min(
            a.x,
            b.x,
            c.x,
            d.x
        );

    const maxX =
        Math.max(
            a.x,
            b.x,
            c.x,
            d.x
        );

    const minY =
        Math.min(
            a.y,
            b.y,
            c.y,
            d.y
        );

    const maxY =
        Math.max(
            a.y,
            b.y,
            c.y,
            d.y
        );


    /* =====================================================
       BLUE TRANSPARENT FRAME
    ===================================================== */

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(c.x, c.y);
    ctx.lineTo(d.x, d.y);

    ctx.closePath();

    ctx.clip();


    const gradient =
        ctx.createLinearGradient(
            minX,
            minY,
            maxX,
            maxY
        );

    gradient.addColorStop(
        0,
        "rgba(0,180,255,.22)"
    );

    gradient.addColorStop(
        .5,
        "rgba(20,80,255,.18)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,255,255,.10)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        minX,
        minY,
        maxX - minX,
        maxY - minY
    );


    /* =====================================================
       SCANLINES
    ===================================================== */

    for (
        let y = minY;
        y < maxY;
        y += 5
    ) {

        ctx.strokeStyle =
            "rgba(100,240,255,.11)";

        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.moveTo(
            minX,
            y
        );

        ctx.lineTo(
            maxX,
            y
        );

        ctx.stroke();

    }


    /* =====================================================
       MOVING SCANNER
    ===================================================== */

    const time =
        performance.now() * .08;

    const scannerY =
        minY +
        (
            (time % 1000) /
            1000
        ) *
        (maxY - minY);

    ctx.strokeStyle =
        "rgba(100,255,255,.55)";

    ctx.shadowBlur = 15;

    ctx.shadowColor =
        cyan;

    ctx.beginPath();

    ctx.moveTo(
        minX,
        scannerY
    );

    ctx.lineTo(
        maxX,
        scannerY
    );

    ctx.stroke();

    ctx.shadowBlur = 0;

    ctx.restore();


    /* =====================================================
       FRAME BORDER
    ===================================================== */

    drawLine(
        a,
        b,
        cyan,
        1.5
    );

    drawLine(
        b,
        c,
        cyan,
        1.5
    );

    drawLine(
        c,
        d,
        cyan,
        1.5
    );

    drawLine(
        d,
        a,
        cyan,
        1.5
    );


    /* =====================================================
       CORNERS
    ===================================================== */

    corner(
        a,
        1,
        1
    );

    corner(
        b,
        -1,
        1
    );

    corner(
        c,
        -1,
        -1
    );

    corner(
        d,
        1,
        -1
    );


    /* =====================================================
       FRAME POINTS
    ===================================================== */

    points.forEach(
        p => {

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                7,
                0,
                Math.PI * 2
            );

            ctx.strokeStyle =
                cyanBright;

            ctx.lineWidth = 1;

            ctx.shadowBlur = 12;

            ctx.shadowColor =
                cyan;

            ctx.stroke();

            ctx.shadowBlur = 0;

            drawPoint(
                p,
                false
            );

        }
    );


    /* =====================================================
       LABEL
    ===================================================== */

    ctx.font =
        "9px Courier New";

    ctx.fillStyle =
        cyanBright;

    ctx.shadowBlur = 8;

    ctx.shadowColor =
        cyan;

    ctx.fillText(
        "HAND FRAME ACTIVE",
        minX,
        maxY + 18
    );

    ctx.shadowBlur = 0;

}


/* =========================================================
   FRAME POINTS
========================================================= */

function getFramePoints() {

    if (
        handsDetected.length < 1
    ) {

        return null;

    }


    if (
        handsDetected.length >= 2
    ) {

        const handA =
            handsDetected[0];

        const handB =
            handsDetected[1];


        const a =
            point(
                handA[8]
            );

        const d =
            point(
                handA[4]
            );

        const b =
            point(
                handB[8]
            );

        const c =
            point(
                handB[4]
            );


        const left =
            a.x < b.x
                ? {
                    index: a,
                    thumb: d
                }
                : {
                    index: b,
                    thumb: c
                };


        const right =
            a.x < b.x
                ? {
                    index: b,
                    thumb: c
                }
                : {
                    index: a,
                    thumb: d
                };


        return [

            left.index,

            right.index,

            right.thumb,

            left.thumb

        ];

    }


    const hand =
        handsDetected[0];


    const index =
        point(
            hand[8]
        );

    const thumb =
        point(
            hand[4]
        );


    const center = {

        x:
            (
                index.x +
                thumb.x
            ) / 2,

        y:
            (
                index.y +
                thumb.y
            ) / 2

    };


    const dx =
        Math.abs(
            index.x -
            thumb.x
        );

    const dy =
        Math.abs(
            index.y -
            thumb.y
        );


    const width =
        Math.max(
            100,
            dx * 2.5
        );

    const height =
        Math.max(
            80,
            dy * 2.5
        );


    return [

        {
            x:
                center.x -
                width / 2,

            y:
                center.y -
                height / 2
        },

        {
            x:
                center.x +
                width / 2,

            y:
                center.y -
                height / 2
        },

        {
            x:
                center.x +
                width / 2,

            y:
                center.y +
                height / 2
        },

        {
            x:
                center.x -
                width / 2,

            y:
                center.y +
                height / 2
        }

    ];

}


/* =========================================================
   CREATE CONTACT PARTICLES
========================================================= */

function createParticles(
    x,
    y
) {

    const amount = 100;

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            1.5 +
            Math.random() * 8;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            size:
                .8 +
                Math.random() *
                3.5,

            life: 1,

            decay:
                .012 +
                Math.random() *
                .025,

            color:
                Math.random() >
                .3
                    ? "#00eaff"
                    : "#ffffff"

        });

    }

}


/* =========================================================
   ENERGY RING
========================================================= */

function createRing(
    x,
    y
) {

    energyRings.push({

        x: x,

        y: y,

        radius: 5,

        life: 1

    });

}


/* =========================================================
   CONTACT CROSSHAIR
========================================================= */

function createContactEffect(
    x,
    y
) {

    contactEffects.push({

        x: x,

        y: y,

        radius: 8,

        life: 1

    });

}


/* =========================================================
   TRIGGER CONTACT EFFECT
========================================================= */

function triggerContact(
    pinky,
    thumb
) {

    const now =
        performance.now();


    /*
       Avoid repeatedly triggering
       while the fingers remain touching.
    */

    if (
        now -
        lastTrigger <
        500
    ) {

        return;

    }

    lastTrigger =
        now;


    const x =
        (
            pinky.x +
            thumb.x
        ) / 2;

    const y =
        (
            pinky.y +
            thumb.y
        ) / 2;


    /* Particle burst */

    createParticles(
        x,
        y
    );


    /* Expanding rings */

    createRing(
        x,
        y
    );

    createRing(
        x,
        y
    );


    /* Target animation */

    createContactEffect(
        x,
        y
    );


    /* Screen flash */

    effectFlash.classList.remove(
        "active"
    );

    void effectFlash.offsetWidth;

    effectFlash.classList.add(
        "active"
    );


    /* Glitch */

    glitch.classList.remove(
        "active"
    );

    void glitch.offsetWidth;

    glitch.classList.add(
        "active"
    );


    /* HUD */

    gestureStatus.textContent =
        "GESTURE / CONTACT LOCK";

    gestureStatus.style.color =
        "#ffffff";


    /*
       Small haptic feedback on supported
       mobile devices.
    */

    if (
        navigator.vibrate
    ) {

        navigator.vibrate(
            [20, 30, 20]
        );

    }

}


/* =========================================================
   DETECT PINKY TOUCHING THUMB
========================================================= */

function detectPinkyThumbTouch() {

    let currentTouch =
        false;


    for (
        const landmarks
        of handsDetected
    ) {

        /*
           MediaPipe hand landmarks:

           4  = THUMB TIP
           20 = PINKY TIP
        */

        const thumb =
            point(
                landmarks[4]
            );

        const pinky =
            point(
                landmarks[20]
            );


        const d =
            distance(
                thumb,
                pinky
            );


        /*
           Relative threshold.

           This is intentionally not
           extremely small so the effect
           feels natural on a phone camera.
        */

        const threshold =
            Math.min(
                canvas.width,
                canvas.height
            ) * .075;


        const isTouching =
            d < threshold;


        /* Connection line */

        drawLine(
            thumb,
            pinky,

            isTouching
                ? "#ffffff"
                : "rgba(0,234,255,.25)",

            isTouching
                ? 3
                : 1
        );


        /* Finger points */

        drawPoint(
            thumb,
            isTouching
        );

        drawPoint(
            pinky,
            isTouching
        );


        /* Distance */

        ctx.font =
            "9px Courier New";

        ctx.fillStyle =
            isTouching
                ? "#ffffff"
                : cyan;

        ctx.shadowBlur = 8;

        ctx.shadowColor =
            cyan;

        ctx.fillText(

            isTouching
                ? "● CONTACT"
                : "DIST " +
                  Math.round(d),

            pinky.x + 12,

            pinky.y

        );

        ctx.shadowBlur = 0;


        if (isTouching) {

            currentTouch =
                true;


            /*
               Trigger only on the moment
               pinky enters the thumb.
            */

            if (!wasTouching) {

                triggerContact(
                    pinky,
                    thumb
                );

            }


            /*
               While touching, create a
               subtle continuous energy.
            */

            drawContactGlow(
                pinky,
                thumb
            );

        }

    }


    wasTouching =
        currentTouch;


    if (
        !currentTouch
    ) {

        gestureStatus.textContent =
            "GESTURE / WAITING";

        gestureStatus.style.color =
            "#67aab1";

    }

}


/* =========================================================
   CONTINUOUS CONTACT GLOW
========================================================= */

function drawContactGlow(
    pinky,
    thumb
) {

    const x =
        (
            pinky.x +
            thumb.x
        ) / 2;

    const y =
        (
            pinky.y +
            thumb.y
        ) / 2;


    const pulse =
        10 +
        Math.sin(
            performance.now() *
            .015
        ) * 5;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        pulse,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.9)";

    ctx.lineWidth = 2;

    ctx.shadowBlur = 30;

    ctx.shadowColor =
        cyan;

    ctx.stroke();

    ctx.shadowBlur = 0;


    /* Energy connection */

    drawLine(
        pinky,
        thumb,
        "rgba(255,255,255,.9)",
        2
    );

}


/* =========================================================
   DRAW HAND SKELETON
========================================================= */

const connections = [

    [0,1],
    [1,2],
    [2,3],
    [3,4],

    [0,5],
    [5,6],
    [6,7],
    [7,8],

    [5,9],
    [9,10],
    [10,11],
    [11,12],

    [9,13],
    [13,14],
    [14,15],
    [15,16],

    [13,17],
    [17,18],
    [18,19],
    [19,20],

    [0,17]

];


function drawHands() {

    for (
        const landmarks
        of handsDetected
    ) {

        const points =
            landmarks.map(
                point
            );


        for (
            const [
                a,
                b
            ]
            of connections
        ) {

            drawLine(
                points[a],
                points[b],
                "rgba(0,210,255,.38)",
                1
            );

        }


        /*
           Highlight thumb and pinky.
        */

        drawPoint(
            points[4]
        );

        drawPoint(
            points[20]
        );


        ctx.font =
            "8px Courier New";

        ctx.fillStyle =
            cyan;

        ctx.fillText(
            "THUMB",
            points[4].x + 9,
            points[4].y - 9
        );

        ctx.fillText(
            "PINKY",
            points[20].x + 9,
            points[20].y - 9
        );

    }

}


/* =========================================================
   PARTICLE RENDERING
========================================================= */

function renderParticles() {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vx *= .965;

        p.vy *= .965;

        p.life -= p.decay;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            p.color;

        ctx.globalAlpha =
            p.life;

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            cyan;

        ctx.fill();

        ctx.globalAlpha = 1;

        ctx.shadowBlur = 0;

    }

}


/* =========================================================
   RENDER ENERGY RINGS
========================================================= */

function renderRings() {

    for (
        let i =
            energyRings.length - 1;

        i >= 0;

        i--
    ) {

        const ring =
            energyRings[i];


        ring.radius += 4;

        ring.life -= .025;


        if (
            ring.life <= 0
        ) {

            energyRings.splice(
                i,
                1
            );

            continue;

        }


        ctx.beginPath();

        ctx.arc(
            ring.x,
            ring.y,
            ring.radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            `rgba(
                0,
                234,
                255,
                ${ring.life}
            )`;

        ctx.lineWidth =
            3 * ring.life;

        ctx.shadowBlur = 25;

        ctx.shadowColor =
            cyan;

        ctx.stroke();

        ctx.shadowBlur = 0;


        /*
           Secondary digital ring
        */

        ctx.beginPath();

        ctx.arc(
            ring.x,
            ring.y,
            ring.radius * .65,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            `rgba(
                255,
                255,
                255,
                ${ring.life * .6}
            )`;

        ctx.lineWidth = 1;

        ctx.stroke();

    }

}


/* =========================================================
   RENDER CONTACT CROSSHAIR
========================================================= */

function renderContactEffects() {

    for (
        let i =
            contactEffects.length - 1;

        i >= 0;

        i--
    ) {

        const effect =
            contactEffects[i];


        effect.radius += 2.5;

        effect.life -= .025;


        if (
            effect.life <= 0
        ) {

            contactEffects.splice(
                i,
                1
            );

            continue;

        }


        const r =
            effect.radius;


        ctx.strokeStyle =
            `rgba(
                255,
                255,
                255,
                ${effect.life}
            )`;

        ctx.lineWidth = 1;


        /* Circle */

        ctx.beginPath();

        ctx.arc(
            effect.x,
            effect.y,
            r,
            0,
            Math.PI * 2
        );

        ctx.stroke();


        /* Horizontal */

        ctx.beginPath();

        ctx.moveTo(
            effect.x - r - 18,
            effect.y
        );

        ctx.lineTo(
            effect.x - r,
            effect.y
        );

        ctx.moveTo(
            effect.x + r,
            effect.y
        );

        ctx.lineTo(
            effect.x + r + 18,
            effect.y
        );

        ctx.stroke();


        /* Vertical */

        ctx.beginPath();

        ctx.moveTo(
            effect.x,
            effect.y - r - 18
        );

        ctx.lineTo(
            effect.x,
            effect.y - r
        );

        ctx.moveTo(
            effect.x,
            effect.y + r
        );

        ctx.lineTo(
            effect.x,
            effect.y + r + 18
        );

        ctx.stroke();


        /* Center */

        ctx.beginPath();

        ctx.arc(
            effect.x,
            effect.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.shadowBlur = 20;

        ctx.shadowColor =
            cyan;

        ctx.fill();

        ctx.shadowBlur = 0;

    }

}


/* =========================================================
   MAIN RENDER LOOP
========================================================= */

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const frame =
        getFramePoints();


    if (frame) {

        drawFrame(
            frame
        );

    }


    drawHands();


    detectPinkyThumbTouch();


    renderParticles();

    renderRings();

    renderContactEffects();


    animationFrame =
        requestAnimationFrame(
            render
        );

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    facingMode:
                        "user"

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.classList.add(
            "hidden"
        );


        /*
           Send camera frames
           to MediaPipe.
        */

        async function process() {

            if (
                video.readyState >=
                HTMLMediaElement.HAVE_CURRENT_DATA
            ) {

                await hands.send({

                    image:
                        video

                });

            }

            requestAnimationFrame(
                process
            );

        }


        process();


        render();

    }

    catch (error) {

        console.error(
            error
        );

        alert(
            "Camera access is required."
        );

    }

}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

            }

            cancelAnimationFrame(
                animationFrame
            );

            location.reload();

        }

    }
);

</script>

<section id="contact" class="section contact-section">
  <div class="section-head">
    <p class="eyebrow mono">// contact</p>
    <h2>Reach the creator!</h2>
  </div>

    <form
      class="contact-form contact-panel"
      id="teachersForm"
      data-form="teachers"
      action="https://formsubmit.co/5399e6b287d38aed0d6cf2f17d7aff0d"
      method="POST">

      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_cc" value="boggsruffa@gmail.com">
      <input type="hidden" name="_subject" value="New submission!">
      
      <div class="form-row">
        <label for="developer-name">Name</label>
        <input type="text" id="developer-name" name="Name" required>
      </div>

      <div class="form-row">
        <label for="developer-email">Email</label>
        <input type="email" id="developer-email" name="Email" required>
      </div>
      
      <div class="form-row">
        <label for="user-report">Report an Issue?</label>
        <select id="developer-team" name="Reporting an Issue" required>
          <option style="opacity:50%;" value="none" hidden>Select an option</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>

      <div class="form-row">
        <label for="developer-team">Team</label>
        <select id="developer-team" name="Team">
          <option value="Web">Web Team</option>
          <option value="Design">Design Team</option>
          <option value="Animation">Animation Team</option>
        </select>
      </div>

      <div class="form-row">
        <label for="developer-message">Message</label>
        <textarea id="developer-message" name="Message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Send Message</button>
      <p class="form-status mono" role="status" aria-live="polite"></p>
    </form>

  </div>
</section>

  <footer class="site-footer">

  </footer>
